# Gateway API served by the AWS Load Balancer Controller: Gateway -> ALB,
# HTTPRoute -> listener rules. No nginx involved. Traffic is split 50/50
# between blue and yellow -- refresh the page and watch the colour change.
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: demo-lb
  namespace: demo
spec:
  scheme: internet-facing
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: gateway.k8s.aws/alb
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo
spec:
  gatewayClassName: aws-alb
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: demo-lb
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Send ALB traffic straight to pod IPs (VPC CNI), not via NodePort.
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: demo-blue
  namespace: demo
spec:
  targetReference:
    name: demo-blue
  defaultConfiguration:
    targetType: ip
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: demo-yellow
  namespace: demo
spec:
  targetReference:
    name: demo-yellow
  defaultConfiguration:
    targetType: ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-route
  namespace: demo
spec:
  parentRefs:
    - name: demo-gateway
  rules:
    - backendRefs:
        - name: demo-blue
          port: 80
          weight: 50
        - name: demo-yellow
          port: 80
          weight: 50
