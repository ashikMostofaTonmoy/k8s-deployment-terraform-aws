# HPA demo. php-apache burns CPU on every request, so load -> CPU -> more pods.
# Metrics Server (installed by terraform) supplies the CPU numbers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: php-apache }
  template:
    metadata:
      labels: { app: php-apache }
    spec:
      containers:
        - name: php-apache
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            # HPA utilisation % is measured against the REQUEST, so it must be set.
            requests: { cpu: 500m, memory: 64Mi }
            limits: { cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: demo
spec:
  selector: { app: php-apache }
  ports:
    - port: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300s; shortened so the demo ends quickly
---
# Traffic generator: hammers the service in a loop. Delete it to stop the load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: demo
spec:
  replicas: 3
  selector:
    matchLabels: { app: load-generator }
  template:
    metadata:
      labels: { app: load-generator }
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://php-apache.demo.svc.cluster.local >/dev/null; done"]
          resources:
            requests: { cpu: 50m, memory: 16Mi }
