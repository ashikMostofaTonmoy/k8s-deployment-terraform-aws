# Classic Ingress served by ingress-nginx (class "external-nginx", behind the
# NLB). Traffic: client -> NLB -> nginx pods -> demo-blue.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: demo
spec:
  ingressClassName: external-nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-blue
                port:
                  number: 80
